name: Unified CI/CD & Changelog

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'CHANGELOG.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-unreleased:
    name: Update Unreleased
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'chore(release)')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Unreleased Changelog
        uses: orhun/git-cliff-action@main
        with:
          config: cliff.toml
          args: --unreleased --output CHANGELOG.md
        env:
          OUTPUT: CHANGELOG.md

      - name: Commit and Push Unreleased
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: update unreleased changes [skip ci]" || echo "No changes to commit"
          git push

  sonarqube:
    name: SonarQube Analysis
    needs: update-unreleased
    runs-on: windows-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache SonarQube Cloud packages
        uses: actions/cache@v4
        with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarQube Cloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarQube Cloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          New-Item -Path ${{ runner.temp }}\scanner -ItemType Directory
          dotnet tool update dotnet-sonarscanner --tool-path ${{ runner.temp }}\scanner

      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: powershell
        run: |
          ${{ runner.temp }}\scanner\dotnet-sonarscanner begin /k:"x341dev_itbXLib" /o:"x341devorg" /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
          dotnet build
          ${{ runner.temp }}\scanner\dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

  calculate-version:
    name: Calculate Version
    needs: [update-unreleased, sonarqube]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bumped.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Compute bumped version
        id: bumped
        run: |
          VERSION=$(git cliff --bumped-version 2>/dev/null | sed 's/^v//')
          echo "Computed next version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate SemVer bump
        run: |
          VERSION="${{ steps.bumped.outputs.version }}"
          NEW_MAJOR=$(echo "$VERSION" | cut -d. -f1)
          NEW_MINOR=$(echo "$VERSION" | cut -d. -f2)
          NEW_PATCH=$(echo "$VERSION" | cut -d. -f3)

          LAST_TAG=$(git describe --tags --abbrev=0 --match "v[0-9]*" 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            RANGE="HEAD"
            OLD_MAJOR=0; OLD_MINOR=0; OLD_PATCH=0
          else
            RANGE="${LAST_TAG}..HEAD"
            STRIPPED=${LAST_TAG#v}
            OLD_MAJOR=$(echo "$STRIPPED" | cut -d. -f1)
            OLD_MINOR=$(echo "$STRIPPED" | cut -d. -f2)
            OLD_PATCH=$(echo "$STRIPPED" | cut -d. -f3)
          fi

          echo "Baseline : ${LAST_TAG:-"(none)"} → ${OLD_MAJOR}.${OLD_MINOR}.${OLD_PATCH}"
          echo "Computed : $VERSION"
          echo ""

          SUBJECTS=$(git log "$RANGE" --format="%s")
          BODIES=$(git log "$RANGE" --format="%b")

          HAS_BREAKING=0
          HAS_FEAT=0
          HAS_PATCH=0

          echo "$SUBJECTS" | grep -qE '^[a-z]+(\([^)]+\))?!:' && HAS_BREAKING=1
          echo "$BODIES"   | grep -qiE '^BREAKING[- ]CHANGE:'  && HAS_BREAKING=1
          echo "$SUBJECTS" | grep -qE '^feat(\([^)]+\))?:'     && HAS_FEAT=1
          echo "$SUBJECTS" | grep -qE '^(fix|perf|security|revert)(\([^)]+\))?:' && HAS_PATCH=1

          if   [ "$HAS_BREAKING" -eq 1 ]; then REQUIRED="MAJOR"
          elif [ "$HAS_FEAT"     -eq 1 ]; then REQUIRED="MINOR"
          elif [ "$HAS_PATCH"    -eq 1 ]; then REQUIRED="PATCH"
          else                                  REQUIRED="NONE"
          fi

          echo "Required bump : $REQUIRED"
          echo ""

          FAIL=0

          case "$REQUIRED" in

            MAJOR)
              # MAJOR must increase; MINOR and PATCH must reset to 0
              if [ "$NEW_MAJOR" -le "$OLD_MAJOR" ]; then
                echo "❌  MAJOR must increment for breaking changes."
                echo "    Baseline major: $OLD_MAJOR  →  Computed major: $NEW_MAJOR"
                FAIL=1
              fi
              if [ "$NEW_MINOR" -ne 0 ]; then
                echo "❌  MINOR must reset to 0 when MAJOR is bumped (got $NEW_MINOR)."
                FAIL=1
              fi
              if [ "$NEW_PATCH" -ne 0 ]; then
                echo "❌  PATCH must reset to 0 when MAJOR is bumped (got $NEW_PATCH)."
                FAIL=1
              fi
              ;;

            MINOR)
              # MINOR must increase (within same MAJOR); PATCH must reset to 0
              if [ "$NEW_MAJOR" -ne "$OLD_MAJOR" ]; then
                echo "❌  MAJOR must not change for a backward-compatible feature (feat)."
                echo "    Baseline: $OLD_MAJOR  →  Computed: $NEW_MAJOR"
                FAIL=1
              fi
              if [ "$NEW_MINOR" -le "$OLD_MINOR" ]; then
                echo "❌  MINOR must increment for new features."
                echo "    Baseline minor: $OLD_MINOR  →  Computed minor: $NEW_MINOR"
                FAIL=1
              fi
              if [ "$NEW_PATCH" -ne 0 ]; then
                echo "❌  PATCH must reset to 0 when MINOR is bumped (got $NEW_PATCH)."
                FAIL=1
              fi
              ;;

            PATCH)
              # Only PATCH increases; MAJOR and MINOR stay the same
              if [ "$NEW_MAJOR" -ne "$OLD_MAJOR" ]; then
                echo "❌  MAJOR must not change for a backward-compatible fix."
                FAIL=1
              fi
              if [ "$NEW_MINOR" -ne "$OLD_MINOR" ]; then
                echo "❌  MINOR must not change for a backward-compatible fix."
                FAIL=1
              fi
              if [ "$NEW_PATCH" -le "$OLD_PATCH" ]; then
                echo "❌  PATCH must increment for bug fixes."
                echo "    Baseline patch: $OLD_PATCH  →  Computed patch: $NEW_PATCH"
                FAIL=1
              fi
              ;;

            NONE)
              echo "ℹ️   No releasable commits found (only docs/chore/ci/test/refactor/style)."
              echo "    No version bump is required."
              # git-cliff may still output the same version — that is acceptable.
              ;;
          esac

          if [ "$FAIL" -eq 1 ]; then
            echo ""
            echo "╔══════════════════════════════════════════════════════════════╗"
            echo "║               ⚠️  SEMVER VIOLATION DETECTED  ⚠️              ║"
            echo "╚══════════════════════════════════════════════════════════════╝"
            echo ""
            echo "Baseline tag : ${LAST_TAG:-none}  (${OLD_MAJOR}.${OLD_MINOR}.${OLD_PATCH})"
            echo "Required bump: $REQUIRED"
            echo "Computed ver : $VERSION"
            echo ""
            echo "See https://semver.org for the full specification."
            exit 1
          fi

          echo "✅  $VERSION satisfies SemVer rules for a $REQUIRED bump."

  build-and-pack:
    name: Build & Pack
    needs: calculate-version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ needs.calculate-version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build and Pack
        run: |
          dotnet restore
          dotnet build --configuration Release
          dotnet pack --configuration Release -o ./packages \
            /p:Version=${{ needs.calculate-version.outputs.version }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: ./packages/*.nupkg
          retention-days: 1

  approve-and-release:
    name: Approve & Publish
    needs: build-and-pack
    runs-on: ubuntu-latest
    environment:
      name: Nuget Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Update Changelog with Tag
        uses: orhun/git-cliff-action@main
        with:
          config: cliff.toml
          args: --tag v${{ needs.build-and-pack.outputs.version }} --output CHANGELOG.md

      - name: Generate Release Notes
        uses: orhun/git-cliff-action@main
        with:
          config: cliff.toml
          args: --tag v${{ needs.build-and-pack.outputs.version }} --current --strip all --output release-notes.md

      - name: Commit and Push Release Changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore(release): prepare for v${{ needs.build-and-pack.outputs.version }} [skip ci]" || echo "No changes"
          git push

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: nuget-package
          path: ./packages

      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push ./packages/*.nupkg --api-key $NUGET_API_KEY --source https://api.nuget.org/v3/index.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build-and-pack.outputs.version }}
          name: Release v${{ needs.build-and-pack.outputs.version }}
          body_path: release-notes.md
          files: ./packages/*.nupkg

