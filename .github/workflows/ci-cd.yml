name: Unified CI/CD & Changelog

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version_suffix:
        description: 'Version sufix (ex. beta.1). Leave blank to use actual.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
        options: --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Run tests with coverage
        run: dotnet test itbXLib.Tests/itbXLib.Tests.csproj --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: ./coverage
          retention-days: 7

  sonarqube:
    name: SonarQube Analysis
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Cache SonarQube Cloud packages
        uses: actions/cache@v5
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Install SonarQube Cloud scanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner begin /k:"x341dev_itbXLib" /o:"x341devorg" /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
          dotnet build
          dotnet test itbXLib.Tests/itbXLib.Tests.csproj --collect:"XPlat Code Coverage" --results-directory ./coverage
          dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

  release-please:
    name: Release Please (PR Gate)
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build-and-pack:
    name: Build & Pack
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Validate version consistency
        run: |
          MANIFEST_VERSION=$(jq -r '.["."]' .release-please-manifest.json)
          CSPROJ_VERSION=$(grep -oP '(?<=<Version>)[^<]+' itbXLib/itbXLib.csproj || echo "")
          TXT_VERSION=$(cat version.txt | tr -d '[:space:]')
          echo "manifest: $MANIFEST_VERSION | csproj: $CSPROJ_VERSION | version.txt: $TXT_VERSION"
          if [ -n "$CSPROJ_VERSION" ] && [ "$MANIFEST_VERSION" != "$CSPROJ_VERSION" ]; then
            echo "ERROR: .release-please-manifest.json ($MANIFEST_VERSION) does not match itbXLib.csproj ($CSPROJ_VERSION)"
            exit 1
          fi
          if [ "$MANIFEST_VERSION" != "$TXT_VERSION" ]; then
            echo "ERROR: .release-please-manifest.json ($MANIFEST_VERSION) does not match version.txt ($TXT_VERSION)"
            exit 1
          fi

      - name: Build and Pack
        run: |
          # Resuelve la versión: Usa la de release-please, o lee version.txt si es manual
          VERSION="${{ needs.release-please.outputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(cat version.txt | tr -d '[:space:]')
            SUFFIX="${{ github.event.inputs.version_suffix }}"
            if [ -n "$SUFFIX" ]; then
              VERSION="${VERSION}-${SUFFIX}"
            fi
            echo "Manual run detected. Using version from file: $VERSION"
          fi
          
          dotnet restore
          dotnet build --configuration Release
          dotnet pack --configuration Release -o ./packages /p:Version=$VERSION

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuget-package
          path: ./packages/*.nupkg
          retention-days: 1

  publish-nuget:
    name: Publish to NuGet
    needs: [release-please, build-and-pack]
    if: ${{ needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment:
      name: Nuget Release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v8
        with:
          name: nuget-package
          path: ./packages

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
        id: login
        with:
          user: x341dev

      - name: Publish to NuGet
        run: dotnet nuget push ./packages/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --skip-duplicate

  publish-github:
    name: Publish to GitHub Packages
    needs: [release-please, build-and-pack]
    if: ${{ needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v8
        with:
          name: nuget-package
          path: ./packages

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
          source-url: https://nuget.pkg.github.com/x341dev/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GitHub Packages
        run: |
          dotnet nuget push "./packages/*.nupkg" \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --source "https://nuget.pkg.github.com/x341dev/index.json" \
            --skip-duplicate
