name: Unified CI/CD & Changelog

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'CHANGELOG.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-unreleased:
    name: Update Unreleased
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'chore(release)')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Unreleased Changelog
        uses: orhun/git-cliff-action@main
        with:
          config: cliff.toml
          args: --unreleased --output CHANGELOG.md
        env:
          OUTPUT: CHANGELOG.md

      - name: Commit and Push Unreleased
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: update unreleased changes [skip ci]" || echo "No changes to commit"
          git push

  sonarqube:
    name: SonarQube Analysis
    needs: update-unreleased
    runs-on: windows-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache SonarQube Cloud packages
        uses: actions/cache@v4
        with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarQube Cloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarQube Cloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          New-Item -Path ${{ runner.temp }}\scanner -ItemType Directory
          dotnet tool update dotnet-sonarscanner --tool-path ${{ runner.temp }}\scanner

      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: powershell
        run: |
          ${{ runner.temp }}\scanner\dotnet-sonarscanner begin /k:"x341dev_itbXLib" /o:"x341devorg" /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
          dotnet build
          ${{ runner.temp }}\scanner\dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

  calculate-version:
    name: Calculate Version
    needs: [update-unreleased, sonarqube]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bumped.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Compute bumped version
        id: bumped
        run: |
          VERSION=$(git cliff --bumped-version 2>/dev/null | sed 's/^v//')
          echo "Computed next version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate major bump for breaking changes
        run: |
          VERSION="${{ steps.bumped.outputs.version }}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)

          # Collect breaking commits since the last semver tag
          LAST_TAG=$(git describe --tags --abbrev=0 --match "v[0-9]*" 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="${LAST_TAG}..HEAD"
          fi

          BREAKING=$(git log "$RANGE" --format="%s" | grep -E '^[a-z]+(\([^)]+\))?!:' || true)
          BREAKING_FOOTER=$(git log "$RANGE" --format="%b" | grep -iE '^BREAKING[- ]CHANGE:' || true)

          HAS_BREAKING=0
          [ -n "$BREAKING" ] && HAS_BREAKING=1
          [ -n "$BREAKING_FOOTER" ] && HAS_BREAKING=1

          if [ "$HAS_BREAKING" -eq 1 ] && [ "$MAJOR" -lt 1 ]; then
            echo ""
            echo "╔══════════════════════════════════════════════════════════════╗"
            echo "║            ⚠️  BREAKING CHANGES — MAJOR BUMP REQUIRED  ⚠️    ║"
            echo "╚══════════════════════════════════════════════════════════════╝"
            echo ""
            echo "Breaking commits found since $LAST_TAG:"
            echo "$BREAKING"
            echo "$BREAKING_FOOTER"
            echo ""
            echo "git-cliff computed version: $VERSION"
            echo "Expected: major >= 1  (e.g. 1.0.0)"
            echo ""
            echo "This usually means all existing tags were listed under skip_tags"
            echo "in cliff.toml, so git-cliff has no baseline to bump from."
            echo "Fix: remove the offending tag from skip_tags and re-run, or"
            echo "     manually create a v1.0.0 tag on the previous release commit."
            echo ""
            exit 1
          fi

          echo "✅  Version $VERSION is consistent with the commit history."

  build-and-pack:
    name: Build & Pack
    needs: calculate-version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ needs.calculate-version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build and Pack
        run: |
          dotnet restore
          dotnet build --configuration Release
          dotnet pack --configuration Release -o ./packages \
            /p:Version=${{ needs.calculate-version.outputs.version }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: ./packages/*.nupkg
          retention-days: 1

  approve-and-release:
    name: Approve & Publish
    needs: build-and-pack
    runs-on: ubuntu-latest
    environment:
      name: Nuget Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Update Changelog with Tag
        uses: orhun/git-cliff-action@main
        with:
          config: cliff.toml
          args: --tag v${{ needs.build-and-pack.outputs.version }} --output CHANGELOG.md

      - name: Generate Release Notes
        uses: orhun/git-cliff-action@main
        with:
          config: cliff.toml
          args: --tag v${{ needs.build-and-pack.outputs.version }} --current --strip all --output release-notes.md

      - name: Commit and Push Release Changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore(release): prepare for v${{ needs.build-and-pack.outputs.version }} [skip ci]" || echo "No changes"
          git push

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: nuget-package
          path: ./packages

      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push ./packages/*.nupkg --api-key $NUGET_API_KEY --source https://api.nuget.org/v3/index.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build-and-pack.outputs.version }}
          name: Release v${{ needs.build-and-pack.outputs.version }}
          body_path: release-notes.md
          files: ./packages/*.nupkg

