name: Unified CI/CD & Changelog

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'CHANGELOG.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-unreleased:
    name: Update Unreleased
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'chore(release)')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Unreleased Changelog
        uses: orhun/git-cliff-action@main
        with:
          config: cliff.toml
          args: --unreleased --output CHANGELOG.md
        env:
          OUTPUT: CHANGELOG.md

      - name: Commit and Push Unreleased
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          # Si no hay cambios nuevos, no falla
          git commit -m "docs: update unreleased changes [skip ci]" || echo "No changes to commit"
          git push

  build-and-pack:
    name: Build & Version
    needs: update-unreleased
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Calculate Semantic Version
        id: version
        uses: PaulHatch/semantic-version@v5.4.0
        with:
          tag_prefix: "v"
          version_format: "${major}.${minor}.${patch}"

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build and Pack
        run: |
          dotnet restore
          dotnet build --configuration Release
          dotnet pack --configuration Release -o ./packages /p:Version=${{ steps.version.outputs.version }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: ./packages/*.nupkg
          retention-days: 1

  approve-and-release:
    name: Approve & Publish
    needs: build-and-pack
    runs-on: ubuntu-latest
    environment:
      name: Nuget Release
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Update Changelog with Tag
        uses: orhun/git-cliff-action@main
        with:
          config: cliff.toml
          args: --tag v${{ needs.build-and-pack.outputs.version }} --output CHANGELOG.md

      - name: Commit and Push Release Changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # No hacemos git pull aquí porque acabamos de hacer checkout de main al principio.
          # Si el repo cambió mucho mientras esperabas la aprobación, el push fallará,
          # pero es más seguro fallar que intentar un merge automático sobre un archivo generado.
          
          git add CHANGELOG.md
          git commit -m "chore(release): prepare for v${{ needs.build-and-pack.outputs.version }} [skip ci]" || echo "No changes"
          git push

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: nuget-package
          path: ./packages

      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push ./packages/*.nupkg --api-key $NUGET_API_KEY --source https://api.nuget.org/v3/index.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build-and-pack.outputs.version }}
          name: Release v${{ needs.build-and-pack.outputs.version }}
          body_path: CHANGELOG.md
          files: ./packages/*.nupkg