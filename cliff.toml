# Configuration for git-cliff
# See https://github.com/orhun/git-cliff/blob/main/cliff.toml for detailed options

[changelog]
# changelog header
header = """
# Changelog

All notable changes to this project are documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
\n"""

# changelog body
body = """
{% if version %}\
    ## [{{ version }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper }}
    {% for commit in commits %}
        - {% if commit.breaking %}**BREAKING**: {% endif %}{{ commit.message | upper_first }} ({{ commit.id | truncate(length=7, end="") }})
        {%- if commit.body %} — {{ commit.body | trim }}{% endif %}
    {% endfor %}
{% endfor %}\n"""

# remove the leading and trailing whitespaces from the commits
trim = true

# changelog footer
footer = ""

[git]
# parse the commits based on https://www.conventionalcommits.org
conventional_commits = true
# filter out the commits that are not conventional commits
filter_unconventional = false
# process each line of a commit as an individual commit
split_commits = false
# regex for parsing the commit messages
commit_parsers = [
    { message = "^feat", group = "Added" },
    { message = "^fix", group = "Fixed" },
    { message = "^doc", group = "Documentation" },
    { message = "^docs", group = "Documentation" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Changed" },
    { message = "^test", group = "Tests" },
    { message = "^ci", group = "CI/CD" },
    { message = "^chore", group = "Chores" },
    { message = "^revert", group = "Reverted" },
    { message = "^security", group = "Security" },
    { message = "^breaking", group = "Breaking Changes" },
]
# protect breaking changes from being skipped due to matching a skipping pattern
protect_breaking_commits = true
# filter out the commits that are not matched by commit parsers
filter_commits = false
# regex for skipping tags
skip_tags = "v0.1.0|v0.1.1"
# regex for ignoring tags
ignore_tags = ""
# sort the commits inside each group by oldest/newest order
sort_commits = "oldest"
# limit the number of commits included in the changelog.
# limit_commits = 42
